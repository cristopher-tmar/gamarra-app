@if (visible) {
<nav class="ui-bottom-nav" [attr.aria-label]="ariaLabel()">
  <div class="ui-bottom-nav__content" [style.grid-template-columns]="'repeat(' + items().length + ', minmax(0, 1fr))'">
    @for (item of items(); track item.route) {
    <a class="ui-bottom-nav__item" [routerLink]="item.route" routerLinkActive="ui-bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
      <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>

      <span>{{ item.label }}</span>
    </a>
    }
  </div>
</nav>
}
