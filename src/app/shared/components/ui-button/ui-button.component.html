<button
  [attr.type]="type"
  [attr.aria-label]="ariaLabel"
  [attr.aria-busy]="loading"
  [disabled]="disabled || loading"
  [class]="
    'ui-button ui-button--' +
    variant +
    ' ui-button--' +
    size +
    (fullWidth ? ' ui-button--full' : '')
  "
>
  @if (loading) {
    <span
      class="ui-button__spinner"
      aria-hidden="true"
    ></span>

    <span class="sr-only">
      Procesando
    </span>
  } @else {
    <span class="ui-button__content">
      <ng-content></ng-content>
    </span>
  }
</button>
