<section class="ui-empty-state ui-empty-state--{{ variant }}" [class.ui-empty-state--compact]="compact">
  <span class="ui-empty-state__icon" aria-hidden="true">
    <ion-icon [name]="icon"></ion-icon>
  </span>

  <h3 class="ui-empty-state__title">
    {{ title }}
  </h3>

  @if (description) {
  <p class="ui-empty-state__description">
    {{ description }}
  </p>
  }

  @if (actionLabel) {
  <div class="ui-empty-state__action">
    <app-ui-button variant="primary" size="medium" [fullWidth]="false" (click)="handleAction()">
      @if (actionIcon) {
      <ion-icon [name]="actionIcon" aria-hidden="true"></ion-icon>
      }

      {{ actionLabel }}
    </app-ui-button>
  </div>
  }
</section>
