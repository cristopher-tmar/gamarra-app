<ion-content [fullscreen]="true">
  <main class="catalog-page">
    <div class="catalog-page__container">

      <header class="catalog-header">
        <div class="catalog-header__brand">
          <span class="catalog-header__logo" aria-hidden="true">
            G
          </span>

          <span class="catalog-header__name">
            Gamarra
          </span>
        </div>
      </header>

      <section class="catalog-page__search">

        <app-ui-search-bar placeholder="Buscar polos, casacas..." ariaLabel="Buscar productos en el catálogo"
          [showCamera]="true" [value]="searchTerm" (valueChange)="searchTerm = $event" (search)="searchProducts($event)"
          (cameraClick)="openVisualSearch()" />

      </section>

      <section class="catalog-page__categories">
        <app-ui-section-header title="Categorías" [compact]="true" />

        <div class="catalog-categories">
          <app-ui-chip label="Todos" variant="brand" [selected]="selectedCategory === undefined"
            (chipClick)="selectCategory('Todos')" />

          <app-ui-chip label="Polos" icon="shirt-outline" variant="brand" [selected]="selectedCategory === 'Polos'"
            (chipClick)="selectCategory('Polos')" />

          <app-ui-chip label="Casacas" variant="accent" [selected]="selectedCategory === 'Casacas'"
            (chipClick)="selectCategory('Casacas')" />

          <app-ui-chip label="Pantalones" variant="neutral" [selected]="selectedCategory === 'Pantalones'"
            (chipClick)="selectCategory('Pantalones')" />
        </div>
      </section>

      <section class="catalog-page__products">
        <app-ui-section-header title="Productos" />

        @if (loading) {
        <div class="catalog-products">
          @for (item of [1, 2, 3, 4]; track item) {
          <app-ui-skeleton variant="product-card" />
          }
        </div>
        } @else if (hasError) {
        <app-ui-error-state title="No pudimos cargar los productos"
          description="Revisa que el API esté disponible e intenta nuevamente." variant="error"
          actionLabel="Volver a intentar" [compact]="true" (retry)="loadProducts()" />
        } @else if (products.length === 0) {
        <app-ui-empty-state title="No encontramos productos"
          description="Prueba con otra búsqueda o selecciona una categoría diferente." icon="search-outline"
          variant="neutral" [compact]="true" />
        } @else {
        <div class="catalog-products">
          @for (
          product of products;
          track product.id;
          let first = $first
          ) {
          <app-ui-product-card [productId]="product.id" [name]="product.nombre" [price]="product.precio"
            [imageUrl]="product.imagenPrincipal?.url" [storeName]="product.tienda.nombre" [category]="product.categoria"
            [stock]="product.stock" [priorityImage]="first" (productClick)="openProduct($event)"
            [favorite]="isFavorite(product.id)" (favoriteChange)="toggleFavorite(product)" />
          }
        </div>
        }

      </section>
    </div>
  </main>

  <app-ui-coachmark title="Busca usando una fotografía"
    description="Toca el botón de cámara para encontrar prendas visualmente similares." icon="camera-outline"
    actionLabel="Entendido" position="bottom" [visible]="showVisualSearchTutorial"
    (dismissed)="dismissVisualSearchTutorial()" />
</ion-content>
